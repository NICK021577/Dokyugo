<a class="booking-card" href="{% url 'ticket' booking.pk %}"><div><h2>{% for document in booking.documents.all %}{{ document.name }}{% if not forloop.last %}, {% endif %}{% endfor %}</h2><p>{{ booking.slot.starts_at|date:'D, M j, Y' }} · {{ booking.slot.starts_at|time:'g:i A' }}</p></div><div class="booking-meta"><span class="queue-label">{{ booking.ticket }}</span><span class="status status-{{ booking.status }}">{{ booking.get_status_display }}</span></div></a>
