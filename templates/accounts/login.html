{% extends 'accounts/base.html' %}
{% block title %}Log in · DokyuGo{% endblock %}
{% block auth_content %}<form method="post" class="account-form" novalidate>{% csrf_token %}<h2>Log in</h2><input type="hidden" name="next" value="{{ next }}">{% include 'includes/form.html' %}<button class="button full-width" type="submit">Log in</button><div class="auth-links spread"><a href="{% url 'password_reset' %}">Forgot password?</a><a href="{% url 'signup' %}">Create an account</a></div></form>{% endblock %}
